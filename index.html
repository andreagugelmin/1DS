<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>

</head>

<body>
    <header>
        <h1>Robótica Educacional</h1>
        <p>Vou compartilhar conhecimentos sobre Robótica e tecnologia</p>
        <style>
            header {
                background-color: #183C63;
                color: #FFFFFF;
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
            }

            main {
                background-color: #FFFFFF;
                color: #183C63;
                display: flex;
            }

            img {
                width: 100px;
                height: 100px;
            }

            .artigo-autor {
                font-weight: bold;
            }
        </style>
    </header>

    <main>
        <img src="robotica.png"
            alt="Explicação resumida sobre a Imagem escolhida, para as pessoas com dificuldades visuais.">
        <div>
            <h2>Meu primeiro post</h2>
            <p class="artigo-autor">Por: Andrea Gugelmin</p>
            <p>Boas-vindas! Aqui vou compartilhar dicas de Robótica e programação e curiosidades da área de tecnologia.</p>
            <button>❤️<span>0</span></button>
            <button>👍 <span>0</span></button>
        </div>
    </main>

</body>
<script>
    const botoes = document.querySelectorAll("button");
    botoes.forEach(function (botao) {
        botao.addEventListener("click", botaoClicado);

        function botaoClicado() {
            console.log("fui clicado");
            let texto = botao.querySelector("span");
            texto.textContent++;
        }
    });
</script>

</html>
